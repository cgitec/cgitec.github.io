<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Applications - CGITEC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .app-hero-medical {
            background: url('assets/medical.jpg') center/cover no-repeat;
            height: 300px;
            position: relative;
            display: flex;
            align-items: center;
            margin-top: var(--nav-height);
        }

        .app-hero-medical::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }

        .app-hero-medical .container {
            position: relative;
            z-index: 2;
        }
    </style>
</head>

<body>

    <div id="nav-placeholder"></div>

    <div class="app-hero-medical">
        <div class="container">
            <h1 style="color: white; font-size: 3rem; font-weight: 700;">의료분야</h1>
            <p style="color: #eee; margin-top: 0.5rem;">Medical Applications</p>
        </div>
    </div>

    <div class="container section">

        <!-- Item 1 -->
        <div class="glass-card"
            style="margin-bottom: 4rem; padding: 0; overflow: hidden; display: flex; flex-direction: row-reverse; flex-wrap: wrap;">
            <div
                style="flex: 1; min-width: 300px; background: url('assets/Radiation_detection_on_person.jpg') center/cover no-repeat; min-height: 300px;">
            </div>
            <div
                style="flex: 1; min-width: 300px; padding: 3rem; display: flex; flex-direction: column; justify-content: center;">
                <h3 style="color: var(--accent-color); margin-bottom: 1.5rem;">실시간 환자 모니터링</h3>
                <ul class="product-check-list">
                    <li>의료 방사선을 투약한 환자의 방사선 거동 탐색</li>
                    <li>투약후 중요한 치료 방사선 세기를 모니터링</li>
                    <li>치료후 방사선원의 소멸여부 실시간 모니터링</li>
                    <li style="margin-top: 10px; font-weight: 600; color: var(--text-primary);">사용장비 : H420</li>
                </ul>
            </div>
        </div>

        <!-- Item 2 -->
        <div class="glass-card" style="padding: 0; overflow: hidden; display: flex; flex-wrap: wrap;">
            <div
                style="flex: 1; min-width: 300px; background: url('assets/medical1.png') center/cover no-repeat; min-height: 300px;">
            </div>
            <div
                style="flex: 1; min-width: 300px; padding: 3rem; display: flex; flex-direction: column; justify-content: center;">
                <h3 style="color: var(--accent-color); margin-bottom: 1.5rem;">M 시리즈 (의료영상용)</h3>
                <ul class="product-check-list">
                    <li>커스터마이징을 위한 모듈형 장비</li>
                    <li>산업계 탑티어 급 대용량 픽셀형 CZT 채용 ( ~19 cm3 이상)</li>
                    <li>실시간 핵종판별 및 감마선 이미징</li>
                    <li>의료영상을 위해 H3D가 디자인한 타일형 M시리즈 장비 (왼쪽 그림)</li>
                </ul>
            </div>
        </div>

    </div>

    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
</body>

</html>
