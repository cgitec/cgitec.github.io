<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBRNE & Security Applications - CGITEC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .app-hero-cbrne {
            background: url('assets/cbrn.jpg') center/cover no-repeat;
            height: 300px;
            position: relative;
            display: flex;
            align-items: center;
            margin-top: var(--nav-height);
        }

        .app-hero-cbrne::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }

        .app-hero-cbrne .container {
            position: relative;
            z-index: 2;
        }
    </style>
</head>

<body>

    <div id="nav-placeholder"></div>

    <div class="app-hero-cbrne">
        <div class="container">
            <h1 style="color: white; font-size: 3rem; font-weight: 700;">화생방분야</h1>
            <p style="color: #eee; margin-top: 0.5rem;">CBRNE / Security</p>
        </div>
    </div>

    <div class="container section">

        <div class="features-grid" style="grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));">

            <!-- Item 1 -->
            <div class="glass-card" style="padding: 0; overflow: hidden;">
                <div style="height: 250px; background: url('assets/cbrn1.jpg') center/cover no-repeat;">
                </div>
                <div style="padding: 2rem;">
                    <h3 style="color: var(--accent-color); margin-bottom: 1rem;">방사선원 분석</h3>
                    <ul class="product-check-list">
                        <li>빌딩, 차량 내부의 방사선원 위치 및 핵종분석</li>
                        <li>작업전 방사선원의 위험레벨 평가</li>
                        <li style="margin-top: 10px; font-weight: 600; color: var(--text-primary);">사용장비 : A / H</li>
                    </ul>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="glass-card" style="padding: 0; overflow: hidden;">
                <div style="height: 250px; background: url('assets/cbrn2.jpg') center/cover no-repeat;">
                </div>
                <div style="padding: 2rem;">
                    <h3 style="color: var(--accent-color); margin-bottom: 1rem;">경기장 보안 및 탐색</h3>
                    <ul class="product-check-list">
                        <li>실시간으로 방사선원 판별</li>
                        <li>의료방사선과 위험방사능의 신속한 구별</li>
                        <li style="margin-top: 10px; font-weight: 600; color: var(--text-primary);">사용장비 : A / H</li>
                    </ul>
                </div>
            </div>

        </div>

        <!-- Full Width Section for Item 3 -->
        <div class="glass-card" style="margin-top: 4rem; padding: 3rem;">
            <div style="display: flex; gap: 40px; align-items: center; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 300px;">
                    <h3 style="color: var(--accent-color); margin-bottom: 1.5rem;">오염지역 탈출을 위한 필수장비</h3>
                    <p style="color: var(--text-secondary); margin-bottom: 1rem;">
                        강한 선원의 위치를 큰 피폭없이 실시간 탐색<br>
                        강한 선원을 피하는 탈출경로 파악<br>
                        360도 전체공간에 대한 이미징으로 쉽게 넓은 지역을 파악할 수 있음.
                    </p>
                    <p style="font-weight: 600; color: var(--text-primary);">사용장비 : A / H / P</p>
                </div>
                <div style="flex: 1.5; min-width: 300px; display: flex; gap: 10px;">
                    <div
                        style="flex:1; height: 200px; display: flex; align-items: center; justify-content: center; border-radius: 8px; overflow: hidden;">
                        <img src="assets/cbrn3.jpg" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div
                        style="flex:1; height: 200px; display: flex; align-items: center; justify-content: center; border-radius: 8px; overflow: hidden;">
                        <img src="assets/Hot_source_walkup.jpg" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
</body>

</html>
