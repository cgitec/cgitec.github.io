<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <title>H3D Mingun digital-ASIC device</title>
    <style>
        .frame-set {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .frame {
            box-sizing: border-box;
            width: 100%;
            height: 800px; /* 원하는 높이로 조절하세요 */
            border: 1px solid #ccc;
        }

        .frame table {
            width: 100%;
            border-collapse: collapse;
        }

        .frame table th, .frame table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
